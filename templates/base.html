<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Caleb Dudley{% endblock %}</title>
  <meta name="description" content="{% block description %}Writing from Caleb Dudley on software, IoT, and cloud infrastructure.{% endblock %}" />

  <meta property="og:type" content="article" />
  <meta property="og:url" content="{{ current_url | safe }}" />
  <meta property="og:title" content="{% block og_title %}Caleb Dudley — Blog{% endblock og_title %}" />
  <meta property="og:description" content="{% block og_description %}Writing from Caleb Dudley on software, IoT, and cloud infrastructure.{% endblock og_description %}" />
  <meta property="og:image" content="{{ config.base_url | safe }}/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{% block twitter_title %}Caleb Dudley — Blog{% endblock twitter_title %}" />
  <meta name="twitter:description" content="{% block twitter_description %}Writing from Caleb Dudley on software, IoT, and cloud infrastructure.{% endblock twitter_description %}" />
  <meta name="twitter:image" content="{{ config.base_url | safe }}/og-image.png" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate" type="application/rss+xml" title="Caleb Dudley — Blog" href="/blog/rss.xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="wrap">
      <a class="nav-brand" href="/#top">Caleb Dudley</a>
      <ul class="nav-links">
        <li><a href="/#about">About</a></li>
        <li><a href="/#experience">Experience</a></li>
        <li><a href="/#projects">Projects</a></li>
        <li><a href="/blog/" class="active">Blog</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <header class="hero hero-sm">
    <div class="hero-decor"></div>
    <div class="wrap hero-inner">
      <div class="hero-text">
        {% block hero %}
        <span class="eyebrow">Blog</span>
        <p class="tagline">Notes on software, IoT, and cloud infrastructure.</p>
        {% endblock hero %}
      </div>
    </div>
  </header>

  {% block content %}{% endblock content %}

  <footer>
    <div class="wrap">
      <span>&copy; <span id="year"></span> Caleb Dudley</span>
      <ul class="footer-links">
        <li><a href="https://github.com/ca1ebd" target="_blank" rel="noopener">GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/dudleycaleb/" target="_blank" rel="noopener">LinkedIn</a></li>
        <li><a href="mailto:calebmdudley@gmail.com">Email</a></li>
      </ul>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
